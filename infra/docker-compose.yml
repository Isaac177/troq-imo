name: mungini

services:

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: mungini-api:local
    container_name: mungini-api
    restart: unless-stopped
    env_file: .env
    environment:
      - API_PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - mungini-network

networks:
  mungini-network:
    name: mungini-network
