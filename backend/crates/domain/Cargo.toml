[package]
name = "domain"
version.workspace = true
edition.workspace = true

[dependencies]
kernel = { path = "../kernel" }
utoipa = "5"
futures = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
