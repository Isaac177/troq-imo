[package]
name = "jobs"
version.workspace = true
edition.workspace = true

[dependencies]
kernel = { path = "../kernel" }
domain = { path = "../domain" }
async-trait = "0.1"
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
